[package]
name = "bot-ross"
version = "0.1.0"
edition = "2024"
default-run = "bot-ross"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = "0.25"
minifb = "0.29"
rand = "0.10"
rayon = "1"
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
toml = "1"

[workspace]
members = ["mcp"]

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
