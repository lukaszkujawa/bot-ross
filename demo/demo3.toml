placement = "fill"
spacing = 6
scatter = 0.25
region = "sphere_half"

[[layers]]
name = "form shadow"
blend = "multiply"
brush = "pencil"
stroke = "shadow"
placement = "fill"
spacing = 5
scatter = 0.25
region = "sphere_shadow"

[[layers]]
name = "core shadow"
blend = "multiply"
brush = "pencil"
stroke = "core"
placement = "fill"
spacing = 4
