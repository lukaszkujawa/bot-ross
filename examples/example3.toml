# /Users/lukasz/Downloads/land2.jpg
[canvas]
background = "white"

[search]
candidates = 8
refinements = 2

[brushes]
water = { file = "../brushes/watercolour.toml" }
wet = { file = "../brushes/watercolour_wet.toml" }
round = { file = "../brushes/soft_round.toml" }
liner = { file = "../brushes/liner.toml" }
pen = { file = "../brushes/pen.toml" }

[strokes]
flood = { radius = [70, 140], length = [150, 400], bend = [0.1, 0.4], pressure = "hand", jitter = 0.15, saturation = 0.6, opacity = 0.35 }
bleed = { radius = [20, 40], length = [10, 200], bend = [0.0, 0.3], pressure = "hand", jitter = 0.1, saturation = 0.8, opacity = 0.8, follow = 0.9 }
detail = { radius = [2, 10], length = [5, 30], bend = [0.0, 0.05], pressure = "hand", jitter = 0.1, follow = 0.9, opacity = 0.9 }
detail2 = { contrast = 1.8, radius = [0.3, 0.8], length = [5, 30], bend = [0.0, 0.05], pressure = "hand", jitter = 0.1, follow = 0.9, opacity = 0.9 }

[[layers]]
name = "floods"
blend = "multiply"
brush = "wet"
stroke = "flood"
count = 100
accident = 0.4
reference = { blur = 30, saturation = 0.5 }

[[layers]]
name = "form"
brush = "water"
stroke = "bleed"
count = 1000
accident = 0.1
reference = { blur = 10, edges = 4 }

[[layers]]
name = "details"
brush = "pen"
stroke = "detail"
count = 2000
accident = 0.05
reference = { edges = 8 }

[[layers]]
name = "details 2"
brush = "pen"
stroke = "detail2"
count = 2000
accident = 0.05
reference = { edges = 4 }
