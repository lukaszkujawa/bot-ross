hair = { radius = [4, 12], length = [60, 240], bend = [0.0, 0.2], jitter = 0.06, follow = 0.9, opacity = 0.8 }
plane = { radius = [8, 20], length = [20, 80], bend = [0.0, 0.2], pressure = "flat", jitter = 0.0, follow = 0.4 }
blend = { radius = [5, 14], length = [15, 60], bend = [0.0, 0.2], pressure = "flat", jitter = 0.0, follow = 0.4 }
shape = { radius = [1.5, 5], length = [6, 30], bend = [0.0, 0.1], pressure = "flat", jitter = 0.0, follow = 0.5 }
edge = { radius = [0.5, 1.2], length = [6, 40], bend = [0.0, 0.1], pressure = "flat", jitter = 0.0, follow = 0.9 }
chip = { radius = [5, 12], length = [15, 50], bend = [0.0, 0.0], pressure = "flat", jitter = 0.12, follow = 0.8, aim = [384, 440] }

[regions]
frame = { centre = [384, 440], radius = 330, weight = 1.0, outside = 0.15, feather = 0.6 }
