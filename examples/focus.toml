[search]
candidates = 12
refinements = 2

[brushes]
knife = { file = "../brushes/knife.toml" }
oil = { file = "../brushes/wet_oil.toml" }
round = { file = "../brushes/soft_round.toml" }
air = { file = "../brushes/airbrush.toml" }
liner = { file = "../brushes/liner.toml" }

[strokes]
ground = { radius = [40, 90], length = [120, 400], bend = [0.0, 0.1], pressure = "flat", jitter = 0.05 }
