[brushes]
oil = { file = "../brushes/wet_oil.toml" }
knife = { file = "../brushes/knife.toml" }
dry = { file = "../brushes/dry_brush.toml" }
pen = { file = "../brushes/pen.toml" }

[strokes]
sweep = { radius = [30, 60], length = [200, 500], bend = [0.1, 0.4] }
block = { radius = [15, 30], length = [80, 250], bend = [0.0, 0.2], pressure = "flat" }
detail = { radius = [3, 8], length = [20, 90], pressure = "fading" }
line = { radius = [1, 2], length = [10, 40], bend = [0.0, 0.1], pressure = "flat" }

[regions]
face = { centre = [512, 380], radius = 260 }

[[layers]]
name = "underpainting"
brush = "oil"
stroke = "sweep"
count = 300

[[layers]]
name = "blocking"
brush = "knife"
stroke = "block"
count = 800

[[layers]]
name = "form"
brush = "dry"
stroke = "detail"
count = 1500
region = "face"

[[layers]]
name = "accents"
brush = "pen"
stroke = "line"
count = 400
placement = "edges"
region = "face"
